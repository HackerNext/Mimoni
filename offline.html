<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D12">
  <title>MiMoni — Offline Vault</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      background: #0B0D12;
      color: #F5F7FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 380px;
      background: #151922;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 28px 22px;
    }
    .badge {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      margin: 0 auto 14px;
      background: rgba(46, 213, 115, 0.16);
      border: 1.5px solid #2ED573;
      color: #2ED573;
      font-size: 1.5rem;
      font-weight: 800;
      display: grid;
      place-items: center;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 8px;
    }
    p {
      font-size: 0.88rem;
      color: #94A0B8;
      line-height: 1.5;
      margin: 0 0 20px;
    }
    a {
      display: inline-block;
      background: #2ED573;
      color: #05160C;
      text-decoration: none;
      font-weight: 800;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">M</div>
    <h1>MiMoni Offline Mode</h1>
    <p>Your local IndexedDB running balance ledger is stored safely on your device. Tap below to open the cached app shell.</p>
    <a href="./index.html">Launch MiMoni Vault</a>
  </div>
</body>
</html>
